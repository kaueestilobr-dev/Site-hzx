<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Painel HZX Vision</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>HZX Vision</h2>
        <ul>
            <li><a href="#membros">Gerenciar Membros</a></li>
            <li><a href="#logs">Logs de Atividades</a></li>
        </ul>
    </div>

    <main class="content">
        <section id="membros">
            <h2>Gerenciamento de Membros</h2>
            <table class="data-table">
                <tr>
                    <th>Usuário</th>
                    <th>Cargo</th>
                    <th>Ações</th>
                </tr>
                <tr>
                    <td>Exemplo#0001</td>
                    <td>Staff</td>
                    <td><button>Punir</button></td>
                </tr>
            </table>
        </section>

        <section id="logs">
            <h2>Logs de Atividades</h2>
            <div class="log-box">
                <p>[12/06/2026] Usuário X banido por Y.</p>
                <p>[12/06/2026] Comando !limpar executado.</p>
            </div>
        </section>
    </main>
</body>
</html>
